name: frontend-check

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-check.yml"
      - ".github/workflows/export-frontend.yml"
      - "tests/test_export_workflow.py"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-check.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2
        working-directory: .
      - run: python -m pytest -q tests/test_export_workflow.py
        working-directory: .
